name: build

# Cross-platform Tauri build matrix. A Mac can't compile the Windows/Linux
# bundles, so this is the only way to verify Plume builds on all three.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only reads the repo (runs on untrusted fork PRs).
permissions:
  contents: read

jobs:
  # The gate. Until this existed, CI compiled the app and shipped a green check
  # without ever running a single test — so a regression that reintroduced the
  # export SSRF, a socket-write escape, or a lock/hang bug would have passed CI
  # clean. `build` depends on this job, so no bundle is produced from a tree
  # whose tests fail.
  test:
    name: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      # Also a gate in its own right: the renderer/bridge/sidecar bundle must
      # build, and the sidecar tests exercise what this produces.
      - name: Build frontend (renderer + bridge + sidecar)
        run: npm run tauri:frontend

      - name: JS tests (sidecar, export SSRF, OAuth, MCP)
        run: npm test

      - name: Rust tests (node probe, containment, parsing)
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-latest
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      # Third-party actions pinned to full commit SHAs (a mutable @tag is a
      # supply-chain lever). Update the SHA + trailing version comment together.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend (renderer + bridge + sidecar)
        run: npm run tauri:frontend

      - name: Tauri build
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Upload bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plume-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
