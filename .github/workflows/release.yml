# Release pipeline: on a version tag, build + Developer-ID sign + notarize the
# macOS app, publish a GitHub Release with the DMG, and emit the auto-updater
# feed (latest.json). Direct distribution — NOT the Mac App Store (see dist/SHIP.md).
#
# Required repo secrets (Settings ▸ Secrets ▸ Actions) — all created by you once:
#   APPLE_CERTIFICATE            base64 of your "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD   password for that .p12
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID                     your Apple ID email
#   APPLE_PASSWORD               an app-specific password for notarization
#   APPLE_TEAM_ID                your 10-char Apple Team ID
#   TAURI_SIGNING_PRIVATE_KEY            updater private key (`tauri signer generate`)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   its password
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Runs BEFORE the signing job, and holds no secrets and no write permission.
  # Two reasons it's a separate job rather than steps inside `macos`: a broken
  # tree can't reach code signing + notarization at all, and the Apple cert and
  # updater key are never injected into a run that was going to fail anyway.
  test:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Deliberately the SAME node-version as the signing job below (20), not
      # build.yml's 22: a gate that tests a different runtime than the one the
      # release is built with isn't gating the release. Keep the two in lockstep
      # if either moves. (The 20-vs-22 split between this workflow and build.yml
      # is pre-existing and worth resolving separately.)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { workspaces: "./src-tauri -> target" }

      - run: npm ci
      - run: npm run tauri:frontend
      - name: JS tests (sidecar, export SSRF, OAuth, MCP)
        run: npm test
      - name: Rust tests (node probe, containment, parsing)
        run: cargo test --manifest-path src-tauri/Cargo.toml

  macos:
    needs: test
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      # Third-party actions pinned to full commit SHAs (a mutable @tag could be
      # repointed to exfiltrate the Apple signing cert + updater key below).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with: { targets: aarch64-apple-darwin,x86_64-apple-darwin }
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { workspaces: "./src-tauri -> target" }

      - run: npm ci
      - run: npm run tauri:frontend   # compile the renderer BEFORE tauri build

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          # code signing + notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # updater artifact signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Plume ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # Universal binary so one DMG runs on Apple Silicon + Intel.
          args: --target universal-apple-darwin
          # NOTE: the auto-updater is NOT wired yet (no tauri-plugin-updater / pubkey in
          # tauri.conf.json), so we do NOT emit latest.json — shipping an update feed the
          # app can't verify would be worse than none. Re-enable includeUpdaterJson only
          # once the updater plugin + pubkey are configured. See packaging/SHIP.md.
