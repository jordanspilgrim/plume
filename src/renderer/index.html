<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: file: blob:; font-src 'self' data:; worker-src 'self' blob:;"
    />
    <title>Plume</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../../dist/renderer.css" />
  </head>
  <body>
    <div id="app" data-theme="system">
      <div id="titlebar"><span id="titlebar-name">Plume</span></div>
      <button id="view-toggle" class="hidden" title="Toggle source / rendered (⌘/)"></button>
      <div id="toolbar"></div>
      <div id="banner" class="hidden"></div>
      <div id="main">
        <aside id="outline" class="hidden" aria-label="Document outline"></aside>
        <div id="editor-host"></div>
        <div id="render-host" class="hidden"></div>
      </div>
    </div>
    <script type="module" src="../../dist/renderer.js"></script>
  </body>
</html>
