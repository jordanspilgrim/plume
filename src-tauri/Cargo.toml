[package]
name = "plume"
version = "0.1.0"
edition = "2021"
description = "A fast, single-surface Markdown editor"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
notify = "6"
ureq = "2"
getrandom = "0.2"
sha2 = "0.10"

# Process-group kill for the bounded node probe (node_runs): a hung shim's
# descendants must die with it, not get orphaned by a direct-child kill.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"

# Linux PDF export via WebKitGTK print-to-file.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"
glib = "0.18"

# Windows control-socket transport (named pipe) — Unix uses std unix sockets.
# Plus WebView2 PrintToPdf for PDF export.
[target.'cfg(windows)'.dependencies]
interprocess = "2"
webview2-com = "0.38"
windows = { version = "0.62", features = ["Win32_Foundation"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# NOTE: deliberately NOT panic = "abort" (cluster C / adversarial review #3).
# Plume holds unsaved user text in memory, and several code paths parse hostile
# input (link-preview response bodies, deep-link URLs, transcripts). With abort,
# one missed edge case anywhere — including in a dependency — takes the whole
# app down and every unsaved buffer with it. With unwind, a panic on a worker or
# command thread is contained: Tauri's command layer turns it into an Err and the
# editor keeps running. The known panic sites are fixed and tested, but unwind is
# the safety net for the ones we haven't found. Costs a small binary-size bump.
